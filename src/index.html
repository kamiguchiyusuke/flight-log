<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #eef0f4;
      --card: #ffffff;
      --text: #1a1c1f;
      --muted: #6b7280;
      --border: #d5d9e0;
      --field: #ffffff;
      --accent: #1565c0;
      --accent-text: #ffffff;
      --shadow: 0 1px 3px rgba(0, 0, 0, .08);

      --first-bg: #e6f4ea;
      --first-border: #34a853;
      --first-text: #14532d;

      --repeat-bg: #fff3e0;
      --repeat-border: #ef8c00;
      --repeat-text: #7a3e00;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1e2126;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #363b42;
        --field: #262a30;
        --accent: #64b5f6;
        --accent-text: #0b0d10;
        --shadow: 0 1px 3px rgba(0, 0, 0, .4);

        --first-bg: #16351f;
        --first-border: #34a853;
        --first-text: #a5e3b8;

        --repeat-bg: #3a2810;
        --repeat-border: #ef8c00;
        --repeat-text: #ffce8a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 16px 48px;
      background: var(--bg);
      color: var(--text);
      /* Latin を先頭に置く。日本語フォントが英数字まで描画すると
         A350-900 の "A" だけ大きく見えるなどメトリクスが崩れるため */
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial,
                   "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    .wrap { max-width: 560px; margin: 0 auto; }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 20px 0 16px;
      letter-spacing: .02em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 6px;
    }

    .field { margin-bottom: 14px; }
    .field:last-of-type { margin-bottom: 0; }

    input {
      width: 100%;
      /* 16px 未満にすると iOS でフォーカス時に勝手にズームされる */
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-height: 48px;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }

    input.upper { text-transform: uppercase; }

    .route {
      display: grid;
      grid-template-columns: 1fr 32px 1fr;
      align-items: end;
      gap: 6px;
    }

    .route .arrow {
      text-align: center;
      color: var(--muted);
      padding-bottom: 13px;
      font-size: 18px;
    }

    /* 重複判定バッジ。このアプリの主役 */
    #badge {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      border-left-width: 4px;
      font-size: 15px;
    }

    #badge.show { display: block; }

    #badge.loading {
      background: var(--field);
      border-color: var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    #badge.first {
      background: var(--first-bg);
      border-color: var(--first-border);
      color: var(--first-text);
    }

    #badge.repeat {
      background: var(--repeat-bg);
      border-color: var(--repeat-border);
      color: var(--repeat-text);
    }

    #badge .headline { font-weight: 700; font-size: 17px; }
    #badge .detail { font-size: 13px; margin-top: 4px; opacity: .85; }

    button {
      width: 100%;
      font-size: 17px;
      font-weight: 600;
      font-family: inherit;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 15px;
      min-height: 52px;
      margin-top: 18px;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: default; }

    h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .log {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .log:last-child { border-bottom: none; }
    .log .left { min-width: 0; }
    .log .sub { font-size: 12px; color: var(--muted); }
    .log .route-text { font-weight: 600; overflow-wrap: anywhere; }
    .log .right { text-align: right; flex-shrink: 0; }
    .log .reg {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }
    .log .type { font-size: 12px; color: var(--muted); text-align: right; }
    .empty { color: var(--muted); font-size: 14px; }

    #toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-width: 528px;
      margin: 0 auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 13px 15px;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }

    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { border-left-color: #d93025; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>搭乗機材ログ</h1>

    <form id="form" class="card" autocomplete="off">
      <div class="field">
        <label for="date">搭乗日</label>
        <input type="date" id="date" required>
      </div>

      <div class="field">
        <label for="flightNo">便名</label>
        <input id="flightNo" class="upper" list="dl-flightNos" placeholder="NH262" autocapitalize="characters" autocorrect="off" spellcheck="false">
      </div>

      <div class="field route">
        <div>
          <label for="dep">出発</label>
          <input id="dep" class="upper" list="dl-airports" placeholder="HND" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false">
        </div>
        <div class="arrow">→</div>
        <div>
          <label for="arr">到着</label>
          <input id="arr" class="upper" list="dl-airports" placeholder="ITM" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false">
        </div>
      </div>

      <div class="field">
        <label for="registration">登録記号</label>
        <input id="registration" class="upper" list="dl-registrations" placeholder="JA873A" required autocapitalize="characters" autocorrect="off" spellcheck="false">
        <div id="badge"></div>
      </div>

      <div class="field">
        <label for="aircraftType">機材型式</label>
        <input id="aircraftType" list="dl-types" placeholder="B787-9">
      </div>

      <div class="field">
        <label for="airline">航空会社</label>
        <input id="airline" list="dl-airlines" placeholder="便名から自動判定">
      </div>

      <div class="field">
        <label for="note">メモ</label>
        <input id="note" placeholder="任意">
      </div>

      <button type="submit" id="submit">保存</button>
    </form>

    <div class="card">
      <h2>直近の記録</h2>
      <div id="recent"><div class="empty">読み込み中…</div></div>
    </div>
  </div>

  <datalist id="dl-flightNos"></datalist>
  <datalist id="dl-airports"></datalist>
  <datalist id="dl-registrations"></datalist>
  <datalist id="dl-types"></datalist>
  <datalist id="dl-airlines"></datalist>

  <div id="toast"></div>

  <script>
    var $ = function (id) { return document.getElementById(id); };

    var badge = $('badge');
    var submitBtn = $('submit');
    var toastTimer = null;

    /* ---------- 起動 ---------- */

    google.script.run
      .withSuccessHandler(function (data) {
        if (!$('date').value) $('date').value = data.today;
        renderSuggestions(data.suggestions);
        renderRecent(data.recent);
      })
      .withFailureHandler(function (err) {
        $('recent').innerHTML = '<div class="empty">読み込みに失敗しました</div>';
        toast(errorText(err), true);
      })
      .bootstrap();

    /* ---------- 登録記号の照合（このアプリの主役） ---------- */

    var lookupTimer = null;
    var lastLookedUp = '';

    function scheduleLookup() {
      clearTimeout(lookupTimer);
      lookupTimer = setTimeout(runLookup, 500);
    }

    function runLookup() {
      clearTimeout(lookupTimer);
      var reg = $('registration').value.trim().toUpperCase();

      if (!reg) {
        lastLookedUp = '';
        setBadge('', '');
        return;
      }
      if (reg === lastLookedUp) return;
      lastLookedUp = reg;

      setBadge('loading', '照合中…');
      google.script.run
        .withSuccessHandler(function (res) {
          // 照合中に入力が変わっていたら、古い結果は捨てる
          if ($('registration').value.trim().toUpperCase() !== reg) return;

          if (!res.found) {
            setBadge('first', '<div class="headline">✨ 初搭乗の機体です</div>');
            return;
          }

          // 機体マスタが知っている型式・航空会社で上書きする
          if (res.type) $('aircraftType').value = res.type;
          if (res.airline) $('airline').value = res.airline;

          var nth = res.timesFlown + 1;
          var html = '<div class="headline">🔁 ' + nth + '回目の搭乗！</div>';
          var last = res.lastFlight;
          if (last) {
            var lastDep = last.depLabel || last.dep;
            var lastArr = last.arrLabel || last.arr;
            html += '<div class="detail">前回: ' + esc(last.date) +
              (last.flightNo ? ' ' + esc(last.flightNo) : '') +
              (lastDep || lastArr ? ' ' + esc(lastDep) + '→' + esc(lastArr) : '') +
              '</div>';
          }
          setBadge('repeat', html);
        })
        .withFailureHandler(function (err) {
          lastLookedUp = '';
          setBadge('', '');
          toast(errorText(err), true);
        })
        .lookupAircraft(reg);
    }

    $('registration').addEventListener('input', scheduleLookup);
    $('registration').addEventListener('blur', runLookup);

    function setBadge(cls, html) {
      badge.className = cls ? 'show ' + cls : '';
      badge.innerHTML = html;
    }

    /* ---------- 便名から航空会社・区間を補完 ---------- */

    $('flightNo').addEventListener('change', function () {
      var no = $('flightNo').value.trim().toUpperCase();
      if (!no) return;

      google.script.run
        .withSuccessHandler(function (res) {
          // 便名由来の値は「空欄のときだけ」埋める。手で直した内容を消さないため
          if (res.airline && !$('airline').value.trim()) $('airline').value = res.airline;
          if (res.dep && !$('dep').value.trim()) $('dep').value = res.dep;
          if (res.arr && !$('arr').value.trim()) $('arr').value = res.arr;
          if (res.type && !$('aircraftType').value.trim()) $('aircraftType').value = res.type;
        })
        .withFailureHandler(function () { /* 補完の失敗は黙って無視する */ })
        .lookupFlightNo(no);
    });

    /* ---------- 大文字化 ---------- */

    ['flightNo', 'dep', 'arr', 'registration'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        this.value = this.value.trim().toUpperCase();
      });
    });

    /* ---------- 保存 ---------- */

    $('form').addEventListener('submit', function (e) {
      e.preventDefault();

      // debounce 待ちの照合が残っていても、保存は保存として進める
      clearTimeout(lookupTimer);

      var payload = {
        date: $('date').value,
        flightNo: $('flightNo').value.trim().toUpperCase(),
        dep: $('dep').value.trim().toUpperCase(),
        arr: $('arr').value.trim().toUpperCase(),
        registration: $('registration').value.trim().toUpperCase(),
        aircraftType: $('aircraftType').value.trim(),
        airline: $('airline').value.trim(),
        note: $('note').value.trim()
      };

      setSaving(true);
      google.script.run
        .withSuccessHandler(function (res) {
          setSaving(false);
          renderRecent(res.recent);
          renderSuggestions(res.suggestions);
          toast('✅ ' + res.registration + ' を保存しました（' + res.timesFlown + '回目）');
          resetForm();
        })
        .withFailureHandler(function (err) {
          setSaving(false);
          toast(errorText(err), true);
        })
        .saveFlight(payload);
    });

    function setSaving(on) {
      submitBtn.disabled = on;
      submitBtn.textContent = on ? '保存中…' : '保存';
    }

    function resetForm() {
      // 搭乗日は残す。同じ日に複数レグ乗ることがあるため
      ['flightNo', 'dep', 'arr', 'registration', 'aircraftType', 'airline', 'note'].forEach(function (id) {
        $(id).value = '';
      });
      lastLookedUp = '';
      setBadge('', '');
      $('flightNo').focus();
    }

    /* ---------- 描画 ---------- */

    function renderRecent(rows) {
      var el = $('recent');
      if (!rows || !rows.length) {
        el.innerHTML = '<div class="empty">まだ記録がありません</div>';
        return;
      }
      el.innerHTML = rows.map(function (r) {
        var dep = r.depLabel || r.dep;
        var arr = r.arrLabel || r.arr;
        var route = (dep || arr) ? esc(dep) + ' → ' + esc(arr) : '';
        var sub = [r.date, r.flightNo].filter(Boolean).map(esc).join(' · ');
        return '<div class="log">' +
          '<div class="left">' +
            '<div class="route-text">' + route + '</div>' +
            '<div class="sub">' + sub + '</div>' +
          '</div>' +
          '<div class="right">' +
            '<div class="reg">' + esc(r.registration) + '</div>' +
            '<div class="type">' + esc(r.type) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderSuggestions(s) {
      if (!s) return;
      fillList('dl-flightNos', s.flightNos);
      fillAirportList('dl-airports', s.airports);
      fillList('dl-registrations', s.registrations);
      fillList('dl-types', s.types);
      fillList('dl-airlines', s.airlines);
    }

    function fillList(id, values) {
      $(id).innerHTML = (values || []).map(function (v) {
        return '<option value="' + esc(v) + '"></option>';
      }).join('');
    }

    /* 空港は {code, name} で届く。label を付けると候補が「HND 羽田」と出る */
    function fillAirportList(id, airports) {
      $(id).innerHTML = (airports || []).map(function (a) {
        return '<option value="' + esc(a.code) + '"' +
          (a.name ? ' label="' + esc(a.name) + '"' : '') + '></option>';
      }).join('');
    }

    /* ---------- ユーティリティ ---------- */

    function toast(msg, isError) {
      var el = $('toast');
      el.textContent = msg;
      el.className = 'show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.className = ''; }, isError ? 6000 : 3000);
    }

    function errorText(err) {
      return (err && err.message) ? err.message : '通信に失敗しました';
    }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
