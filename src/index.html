<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
/* Hallmark · genre: editorial · macrostructure: Index-First · theme: custom
 * vibe: "warm ledger stock, blue-black ink, red only for corrections"
 * paper oklch(96.5% 0.015 85) warm-cream · accent oklch(45% 0.15 250) ink-blue
 * alert oklch(50% 0.18 30) ledger-red — corrections and totals only
 * display Zen Old Mincho · body IBM Plex Sans · outlier IBM Plex Mono
 * axes: light paper / classical-serif display / cool accent
 * nav: N6 masthead (left-flush knob) · footer: Ft2 inline rule
 * pre-emit critique: P5 H5 E4 S5 R5 V4
 */

    /* ── tokens ─────────────────────────────────────────────── */

    :root {
      color-scheme: light dark;

      /* 台帳の紙。温かいクリーム地(hue 85) */
      --color-paper:      oklch(96.5% 0.015 85);
      --color-paper-2:    oklch(93.5% 0.019 82);
      --color-paper-3:    oklch(90%   0.022 82);
      /* 紙は温かいまま、その上に引かれるもの（罫・文字）は青黒へ寄せる */
      --color-rule:       oklch(80%   0.020 245);
      --color-rule-firm:  oklch(60%   0.030 250);
      --color-muted:      oklch(47%   0.025 255);
      --color-ink:        oklch(22%   0.030 265);

      /* 主色は記入用のインク青。罫・見出し・活性の目印はすべてこれ */
      --color-accent:      oklch(45% 0.15 250);
      /* 赤は「注意・訂正・合計」だけに退く。台帳で赤が担う役割そのまま */
      --color-accent-warm: oklch(50% 0.18 30);
      --color-focus:       oklch(45% 0.15 250);

      /*
       * ロゴを刷る下地。明暗どちらのテーマでも明るいままにする。
       * 航空会社のロゴは濃色・透過 PNG が多く、暗い地色に直接置くと沈んで
       * 消える。明るい紙に刷って貼り付けたシールとして扱う。
       */
      --color-sticker:    oklch(98% 0.006 85);

      --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --font-body:    "IBM Plex Sans", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      --font-figure:  "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

      --space-3xs: 0.125rem;
      --space-2xs: 0.25rem;
      --space-xs:  0.5rem;
      --space-sm:  0.75rem;
      --space-md:  1rem;
      --space-lg:  1.5rem;
      --space-xl:  2.5rem;
      --space-2xl: 4rem;

      --text-xs:   0.6875rem;
      --text-sm:   0.8125rem;
      --text-base: 1rem;
      --text-md:   1.125rem;
      --text-lg:   1.375rem;
      --text-xl:   1.75rem;

      --rule-hair: 1px;
      --rule-firm: 2px;
      --page-gutter: clamp(0.875rem, 4vw, 2rem);

      /* 台帳に角丸は無い。ここを 0 に固定することが今回の設計の背骨 */
      --radius: 0;

      --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in:     cubic-bezier(0.7, 0, 0.84, 0);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;

      --shadow-hair: 0 1px 2px oklch(20% 0.01 265 / 0.14);

      --z-base: 1;
      --z-dropdown: 100;
      --z-toast: 500;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        /* 革表紙の記録簿を灯りの下で開いた状態。色相は動かさず明度と彩度だけ動かす */
        --color-paper:      oklch(16%   0.016 265);
        --color-paper-2:    oklch(19.5% 0.018 265);
        --color-paper-3:    oklch(23%   0.020 263);
        --color-rule:       oklch(33%   0.020 258);
        --color-rule-firm:  oklch(52%   0.024 254);
        --color-muted:      oklch(70%   0.020 252);
        --color-ink:        oklch(93%   0.014 250);

        --color-accent:      oklch(70% 0.12 250);
        --color-accent-warm: oklch(66% 0.15 32);
        --color-focus:       oklch(70% 0.12 250);

        --shadow-hair: 0 1px 2px oklch(4% 0.01 70 / 0.5);
      }
    }

    /* ── base ───────────────────────────────────────────────── */

    *, *::before, *::after { box-sizing: border-box; }

    html, body { overflow-x: clip; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      padding-block: 0 var(--space-2xl);
      padding-inline: max(var(--page-gutter), env(safe-area-inset-left))
                      max(var(--page-gutter), env(safe-area-inset-right));
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
    }

    .sheet { max-width: 34rem; margin-inline: auto; }

    /* ── N6 masthead（左寄せノブ） ──────────────────────────── */

    .mast { padding-block: var(--space-lg) 0; }

    .mast__meta {
      margin: 0;
      font-size: var(--text-xs);
      letter-spacing: 0.22em;
      color: var(--color-muted);
    }

    .mast__name {
      margin: var(--space-3xs) 0 var(--space-xs);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-xl);
      line-height: 1.1;
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    /* 見出し下の二重罫。細い罫の下に赤の太罫を置く＝記録簿の表紙の作法 */
    .mast__rule {
      border: 0;
      border-top: var(--rule-hair) solid var(--color-rule-firm);
      border-bottom: var(--rule-firm) solid var(--color-accent);
      height: 3px;
      margin: 0;
    }

    /* ── 見出しタブ ─────────────────────────────────────────── */

    .tabs {
      display: flex;
      gap: var(--space-lg);
      border-bottom: var(--rule-hair) solid var(--color-rule);
    }

    .tab {
      appearance: none;
      background: none;
      border: 0;
      border-bottom: var(--rule-firm) solid transparent;
      margin-bottom: -1px;
      padding: var(--space-sm) var(--space-3xs);
      min-height: 44px;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--color-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: color var(--dur-micro) var(--ease-out);
    }

    .tab[aria-selected="true"] {
      color: var(--color-ink);
      border-bottom-color: var(--color-accent);
    }

    .tab:active { color: var(--color-ink); }
    .tab:focus-visible { outline: var(--rule-firm) solid var(--color-focus); outline-offset: 2px; }

    .tab__count {
      font-family: var(--font-figure);
      font-size: var(--text-xs);
      font-weight: 400;
      letter-spacing: 0;
      color: var(--color-muted);
      margin-inline-start: var(--space-2xs);
    }

    .panel { display: none; }
    .panel[data-active="true"] { display: block; }

    /* ── 記入欄：罫線の上に書く ─────────────────────────────── */

    .form { margin: 0; }

    .row {
      display: grid;
      gap: var(--space-3xs);
      padding-block: var(--space-sm);
      border-bottom: var(--rule-hair) solid var(--color-rule);
    }

    /* 区間は 1 本の罫の中に 2 欄。実物の書式と同じく矢印で結ぶ */
    .row--split {
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      column-gap: var(--space-sm);
    }

    .row__arrow {
      padding-bottom: var(--space-xs);
      color: var(--color-rule-firm);
      font-size: var(--text-md);
      line-height: 1;
    }

    .cell { display: grid; gap: var(--space-3xs); min-width: 0; }

    /* 航空会社欄。左にロゴ枠を置き、記入中にロゴの有無が見えるようにする */
    .row__withmark {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: var(--space-sm);
      align-items: center;
    }

    .airlogo {
      display: grid;
      place-items: center;
      width: 1.75rem;
      height: 1.75rem;
      appearance: none;
      margin: 0;
      padding: var(--space-3xs);
      border: var(--rule-hair) dashed var(--color-rule-firm);
      background: var(--color-sticker);
      cursor: pointer;
    }

    /* ロゴが入っている、またはコードが決まっている状態。枠を実線にする */
    .airlogo[data-state="has"],
    .airlogo[data-state="code"] { border-style: solid; }

    /* 便名が無いと紐づける会社が決まらないので押せない */
    .airlogo[disabled] {
      cursor: default;
      border-color: var(--color-rule);
      background: none;
    }

    .airlogo:focus-visible {
      outline: var(--rule-firm) solid var(--color-focus);
      outline-offset: 2px;
    }

    .airlogo img { display: block; width: 100%; height: 100%; object-fit: contain; }

    .airlogo__code {
      font-family: var(--font-figure);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--color-ink);
    }

    .airlogo__none { color: var(--color-rule-firm); font-size: var(--text-xs); }

    /* 和英併記。実際の航空書式がそうなっているので飾りではない */
    .lab {
      display: flex;
      align-items: baseline;
      gap: var(--space-xs);
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--color-muted);
    }

    .lab__lat {
      font-weight: 400;
      font-size: 0.625rem;
      letter-spacing: 0.18em;
      color: var(--color-muted);
    }

    .fld {
      width: 100%;
      min-width: 0;
      appearance: none;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
      padding: var(--space-2xs) 0;
      /* 16px 未満にすると iOS でフォーカス時に勝手にズームされる */
      font-size: var(--text-base);
      font-family: var(--font-body);
      color: var(--color-ink);
      min-height: 2.25rem;
    }

    .fld::placeholder { color: var(--color-muted); }
    .fld:focus { outline: none; }

    /* フォーカスは欄そのものではなく行の罫を赤くする。紙に定規を当てた感じ */
    .row:focus-within { border-bottom-color: var(--color-accent); }

    .fld:focus-visible { outline: var(--rule-firm) solid var(--color-focus); outline-offset: 3px; }

    .fld--fig { font-family: var(--font-figure); letter-spacing: 0.04em; }
    .fld--upper { text-transform: uppercase; }

    .fld--reg {
      font-family: var(--font-figure);
      font-size: var(--text-lg);
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    /* iOS の Safari は input[type=date] に固有の幅を持たせるため、
       width:100% が効かず欄からはみ出す。appearance を落として外す */
    input[type="date"].fld {
      display: block;
      max-width: 100%;
      text-align: left;
      font-family: var(--font-figure);
    }

    .fld:disabled { color: var(--color-muted); cursor: default; }

    .fld.is-invalid { border-bottom: var(--rule-firm) solid var(--color-accent-warm); }

    /* ── 写真を貼る欄 ───────────────────────────────────────── */

    .affix {
      position: relative;
      margin-block: var(--space-md) 0;
      padding: var(--space-md) var(--space-sm);
      border: var(--rule-hair) dashed var(--color-rule-firm);
      background: var(--color-paper-2);
    }

    /* 写真コーナー（台紙の金具）。この書式が何であるかを一目で語る */
    .affix__corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 0 solid var(--color-rule-firm);
    }

    .affix__corner:nth-of-type(1) { top: 4px;    left: 4px;  border-width: 1px 0 0 1px; }
    .affix__corner:nth-of-type(2) { top: 4px;    right: 4px; border-width: 1px 1px 0 0; }
    .affix__corner:nth-of-type(3) { bottom: 4px; left: 4px;  border-width: 0 0 1px 1px; }
    .affix__corner:nth-of-type(4) { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }

    .affix__btn {
      display: block;
      width: 100%;
      appearance: none;
      background: none;
      border: 0;
      border-radius: var(--radius);
      padding: var(--space-2xs);
      min-height: 40px;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--color-ink);
      white-space: nowrap;
      cursor: pointer;
    }

    .affix__btn:active { color: var(--color-accent); }
    .affix__btn:focus-visible { outline: var(--rule-firm) solid var(--color-focus); outline-offset: 2px; }
    .affix__btn[disabled] { color: var(--color-muted); cursor: default; }

    .affix__hint {
      margin: var(--space-2xs) 0 0;
      font-size: var(--text-xs);
      letter-spacing: 0.08em;
      color: var(--color-muted);
      text-align: center;
    }

    /* Ctrl+V の案内はマウスのある端末にだけ。スマホに Ctrl+V は無い */
    .affix__hint--paste { display: none; }
    @media (hover: hover) and (pointer: fine) {
      .affix__hint--paste { display: block; }
    }

    .scanout { margin: var(--space-sm) 0 0; font-size: var(--text-sm); color: var(--color-muted); }

    .scanout__engine {
      font-family: var(--font-figure);
      font-size: var(--text-xs);
      letter-spacing: 0.12em;
      color: var(--color-accent);
      margin-inline-end: var(--space-xs);
    }

    .scanout__note { margin: var(--space-2xs) 0 0; color: var(--color-accent-warm); }
    .scanout summary { cursor: pointer; margin-top: var(--space-2xs); }

    .scanout pre {
      margin: var(--space-2xs) 0 0;
      padding: var(--space-xs);
      max-height: 11rem;
      overflow: auto;
      background: var(--color-paper);
      border: var(--rule-hair) solid var(--color-rule);
      font-family: var(--font-figure);
      font-size: var(--text-xs);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ── 照合印 ─────────────────────────────────────────────── */

    .stamp { display: none; margin-top: var(--space-sm); }
    .stamp[data-state] { display: block; }

    .stamp__box {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space-xs);
      padding: var(--space-2xs) var(--space-sm);
      border: var(--rule-firm) solid currentColor;
      letter-spacing: 0.12em;
    }

    .stamp[data-state="first"]  .stamp__box { color: var(--color-accent); }
    .stamp[data-state="repeat"] .stamp__box { color: var(--color-accent-warm); }

    .stamp[data-state="load"] .stamp__box {
      color: var(--color-muted);
      border-width: var(--rule-hair);
      border-style: dashed;
    }

    .stamp__n {
      font-family: var(--font-figure);
      font-size: var(--text-lg);
      font-weight: 600;
      line-height: 1;
    }

    .stamp__word { font-size: var(--text-sm); font-weight: 600; }

    .stamp__prev {
      margin: var(--space-2xs) 0 0;
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      color: var(--color-muted);
    }

    /* ── 記入の確認 ─────────────────────────────────────────── */

    .alert {
      display: none;
      margin: var(--space-md) 0 0;
      padding: var(--space-xs) var(--space-sm);
      border-inline-start: var(--rule-firm) solid var(--color-accent-warm);
      font-size: var(--text-sm);
      color: var(--color-accent-warm);
    }

    .alert[data-show="true"] { display: block; }

    .submit {
      width: 100%;
      margin-top: var(--space-lg);
      appearance: none;
      background: var(--color-ink);
      color: var(--color-paper);
      border: 0;
      border-radius: var(--radius);
      padding: var(--space-sm);
      min-height: 48px;
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 600;
      letter-spacing: 0.18em;
      white-space: nowrap;
      cursor: pointer;
      transition: transform var(--dur-micro) var(--ease-out);
    }

    .submit:active { transform: translateY(1px); }
    .submit:focus-visible { outline: var(--rule-firm) solid var(--color-focus); outline-offset: 3px; }
    .submit[disabled] { background: var(--color-rule-firm); cursor: default; transform: none; }

    /* ── 台帳 ───────────────────────────────────────────────── */

    .tally {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm) var(--space-lg);
      padding-block: var(--space-md);
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      color: var(--color-muted);
    }

    .tally__n {
      font-size: var(--text-md);
      font-weight: 600;
      color: var(--color-ink);
      margin-inline-end: var(--space-2xs);
    }

    /*
     * 行が押せることの案内。スマホには hover が無く、行がただの文字に見える。
     * 押せると分かる手がかりがどこにも無かった
     */
    .ledger__hint {
      margin: 0 0 var(--space-sm);
      font-size: var(--text-xs);
      letter-spacing: 0.08em;
      color: var(--color-muted);
    }

    .ledger__head {
      display: grid;
      grid-template-columns: 2.75rem minmax(0, 1fr) auto;
      gap: var(--space-sm);
      padding-block: var(--space-2xs);
      border-top: var(--rule-hair) solid var(--color-rule-firm);
      border-bottom: var(--rule-hair) solid var(--color-rule-firm);
      font-size: 0.625rem;
      letter-spacing: 0.18em;
      color: var(--color-muted);
    }

    .ledger__head span:last-child { text-align: end; }

    .year {
      padding-block: var(--space-lg) var(--space-2xs);
      border-bottom: var(--rule-hair) solid var(--color-accent);
      font-family: var(--font-figure);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--color-accent);
    }

    .year:first-child { padding-top: var(--space-sm); }

    /*
     * 1 行に 2 つのボタンを並べる。左端の印はロゴの操作、本体は記録の編集。
     * 入れ子のボタンは作れないので、grid の列をそのまま当たり判定に使う。
     */
    .entry {
      display: grid;
      grid-template-columns: 2.75rem minmax(0, 1fr);
      gap: var(--space-sm);
      padding-block: var(--space-md);
      border-bottom: var(--rule-hair) solid var(--color-rule);
    }

    .entry__mark,
    .entry__body {
      appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      text-align: start;
    }

    button.entry__mark,
    button.entry__body { cursor: pointer; }

    button.entry__mark:focus-visible,
    button.entry__body:focus-visible {
      outline: var(--rule-firm) solid var(--color-focus);
      outline-offset: 2px;
    }

    button.entry__mark:active,
    button.entry__body:active { opacity: .65; }

    .entry__body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-sm);
      align-items: start;
    }

    .entry__main { min-width: 0; display: grid; gap: var(--space-2xs); }

    /*
     * 出発と到着を列の両端へ振り、間を細い罫で結ぶ。
     * 空港名は長さがまちまち（羽田(HND) と 台北桃園(TPE)）なので、
     * 両端は縮んで折り返せるようにし、余った幅を罫が吸う
     */
    .entry__leg {
      /* 空港名の大きさ。飛行機の箱の高さもこれに追従させる */
      --port-size: var(--text-md);
      --port-line: 1.3;

      /*
       * 左右を同じ幅の列にして、飛行機を必ず真ん中に置く。
       * flex で伸縮させると両側の空港名の長さで位置が動き、
       * 行ごとに飛行機が左右にばらつく
       */
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: baseline;
      gap: var(--space-2xs);
      min-width: 0;
    }

    .entry__port {
      min-width: 0;
      font-size: var(--port-size);
      font-weight: 600;
      line-height: var(--port-line);
      overflow-wrap: anywhere;
    }

    .entry__port--arr { text-align: end; }
    .entry__port--none { font-weight: 400; color: var(--color-muted); }

    /*
     * 空港名は baseline で揃えているので、飛行機だけ align-self:center にすると
     * 行が 2 段になったときに段の間へ落ちる。空港名 1 行分の高さの箱を作り、
     * その中で中央に置けば、折り返しても 1 行目と同じ高さに留まる
     */
    .entry__link {
      display: grid;
      place-items: center;
      align-self: start;
      padding-inline: var(--space-2xs);
      height: calc(var(--port-size) * var(--port-line));
      color: var(--color-rule-firm);
    }

    .entry__link svg {
      display: block;
      width: 1.125rem;
      height: 1.125rem;
      fill: currentColor;
    }

    @media (hover: hover) and (pointer: fine) {
      button.entry__body:hover .entry__port {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      button.entry__mark:hover .carrier,
      button.entry__mark:hover .carrier-logo { border-color: var(--color-accent); }
    }

    /* 交互の地色。行を目で追うための実用で、装飾ではない。
       年の見出しが間に挟まるので、偶奇は JS 側で数える */
    .entry--alt { background: var(--color-paper-2); }

    .entry__mark { display: grid; gap: var(--space-3xs); justify-items: start; }

    /*
     * 航空会社は 2 レターコードを枠で囲った符号として出す。
     * 実物のロゴは商標で持ち込めないうえ、台帳の欄外に押す印という
     * この書式の語彙にも符号のほうが合う。表に無い会社でも必ず出る。
     */
    .carrier {
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      border: var(--rule-hair) solid var(--color-rule-firm);
      font-family: var(--font-figure);
      font-size: var(--text-sm);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.06em;
      color: var(--color-ink);
    }

    /* ロゴがある会社はこちら。符号と同じ枠の位置に収め、台帳の桁を崩さない */
    .carrier-logo {
      display: block;
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
      padding: var(--space-3xs);
      border: var(--rule-hair) solid var(--color-rule);
      background: var(--color-sticker);
    }

    .entry__meta {
      display: block;
      min-width: 0;
      /* 飛行機は leg の中央にあるので、中央寄せにすればその真下に来る */
      text-align: center;
      overflow-wrap: anywhere;
      font-family: var(--font-figure);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      color: var(--color-muted);
    }

    .entry__reg {
      display: block;
      text-align: end;
      font-family: var(--font-figure);
      font-size: var(--text-base);
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
    }

    .entry__type {
      display: block;
      font-weight: 400;
      font-size: var(--text-xs);
      color: var(--color-muted);
    }

    .empty { padding-block: var(--space-xl); color: var(--color-muted); font-size: var(--text-sm); }

    /* 編集中であることの表示。記入と上書きを取り違えると記録が壊れる */
    .editing {
      display: none;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-sm);
      margin-top: var(--space-md);
      padding: var(--space-xs) var(--space-sm);
      border-inline-start: var(--rule-firm) solid var(--color-accent);
      background: var(--color-paper-2);
      font-size: var(--text-sm);
    }

    .editing[data-show="true"] { display: flex; }

    .editing__acts { display: flex; gap: var(--space-md); white-space: nowrap; }

    /*
     * 削除は 2 段階。1 回目で「本当に削除」に変わり、もう一度押すと消える。
     * ネイティブの confirm() は GAS のサンドボックス iframe で出ない恐れがあり、
     * 「押しても何も起きない」が最悪なので使わない。
     */
    .editing__del {
      appearance: none;
      margin: 0;
      padding: var(--space-3xs) 0;
      border: 0;
      background: none;
      font: inherit;
      font-weight: 600;
      color: var(--color-accent-warm);
      text-decoration: underline;
      text-underline-offset: 3px;
      white-space: nowrap;
      cursor: pointer;
    }

    .editing__del[data-arm="true"] {
      padding-inline: var(--space-xs);
      border: var(--rule-firm) solid var(--color-accent-warm);
      text-decoration: none;
    }

    .editing__del:focus-visible {
      outline: var(--rule-firm) solid var(--color-focus);
      outline-offset: 2px;
    }

    .editing__cancel {
      appearance: none;
      margin: 0;
      padding: var(--space-3xs) 0;
      border: 0;
      background: none;
      font: inherit;
      font-weight: 600;
      color: var(--color-accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      white-space: nowrap;
      cursor: pointer;
    }

    .editing__cancel:focus-visible {
      outline: var(--rule-firm) solid var(--color-focus);
      outline-offset: 2px;
    }

    /* Ft2 · 繰越合計。台帳の頁末にある行をそのまま機能させる */
    .colophon {
      display: flex;
      justify-content: space-between;
      gap: var(--space-sm);
      margin-top: var(--space-md);
      padding-top: var(--space-xs);
      border-top: var(--rule-firm) solid var(--color-rule-firm);
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      color: var(--color-muted);
    }

    /* ── 候補 ───────────────────────────────────────────────── */

    .combo-host { position: relative; }

    .suggest {
      display: none;
      position: absolute;
      z-index: var(--z-dropdown);
      max-height: 15rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background: var(--color-paper);
      border: var(--rule-hair) solid var(--color-rule-firm);
      box-shadow: var(--shadow-hair);
    }

    .suggest__item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--space-sm);
      padding: var(--space-xs) var(--space-sm);
      min-height: 44px;
      border-bottom: var(--rule-hair) solid var(--color-rule);
      font-size: var(--text-sm);
      cursor: pointer;
    }

    .suggest__item:last-child { border-bottom: 0; }
    .suggest__val { font-family: var(--font-figure); font-weight: 600; }
    .suggest__lab { font-size: var(--text-xs); color: var(--color-muted); }

    @media (hover: hover) and (pointer: fine) {
      .suggest__item:hover { background: var(--color-paper-3); }
    }

    /* ── 通知 ───────────────────────────────────────────────── */

    #toast {
      position: fixed;
      inset-inline: var(--page-gutter);
      bottom: max(var(--space-md), env(safe-area-inset-bottom));
      max-width: 32rem;
      margin-inline: auto;
      z-index: var(--z-toast);
      padding: var(--space-sm) var(--space-md);
      background: var(--color-ink);
      color: var(--color-paper);
      border-inline-start: var(--rule-firm) solid var(--color-accent);
      font-size: var(--text-sm);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
      pointer-events: none;
    }

    #toast[data-show="true"] { opacity: 1; transform: none; }
    #toast[data-kind="error"] { border-inline-start-color: var(--color-accent-warm); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 150ms !important;
        transition-duration: 150ms !important;
      }
      .submit:active { transform: none; }
    }

    /*
     * 360px 未満では空港名が両端に収まらず毎行折り返す。
     * 台北桃園(TPE) のような長い名前は結局折り返すが、
     * 羽田(HND) 程度なら 1 行に収まるところまで落とす
     */
    @media (max-width: 22.5rem) {
      .entry__leg { --port-size: var(--text-sm); }
      .entry__reg { font-size: var(--text-sm); }
    }

    @media (min-width: 40rem) {
      .mast { padding-block: var(--space-xl) 0; }
      .mast__name { font-size: 2.125rem; }
    }
  </style>
</head>
<body>
  <!--
    区間を結ぶ飛行機。絵文字は端末ごとに形も向きも変わるので自分で描く。
    形の定義は 1 回だけ置き、各行は <use> で参照する
  -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ic-plane" viewBox="0 0 32 32">
      <path d="M30 16 L21 13.8 L13 3 L10 3 L16.5 13.6 L7 13.8 L4 8 L2 8 L4.5 13.9 L3 16 L4.5 18.1 L2 24 L4 24 L7 18.2 L16.5 18.4 L10 29 L13 29 L21 18.2 Z"/>
    </symbol>
  </svg>

  <div class="sheet">

    <header class="mast">
      <p class="mast__meta">FLIGHT LOG</p>
      <h1 class="mast__name">搭乗機材ログ</h1>
      <hr class="mast__rule" aria-hidden="true">
    </header>

    <nav class="tabs" role="tablist" aria-label="表示の切り替え">
      <button type="button" class="tab" id="tab-input" role="tab" aria-selected="true"
              aria-controls="panel-input" data-panel="panel-input">記入</button>
      <button type="button" class="tab" id="tab-log" role="tab" aria-selected="false"
              aria-controls="panel-log" data-panel="panel-log">台帳<span class="tab__count" id="tabCount"></span></button>
    </nav>

    <section id="panel-input" class="panel" data-active="true" role="tabpanel" aria-labelledby="tab-input">
      <form id="form" class="form" autocomplete="off" novalidate>

        <div class="editing" id="editing" data-show="false">
          <span id="editingLabel"></span>
          <span class="editing__acts">
            <button type="button" class="editing__cancel" id="editCancel">やめる</button>
            <button type="button" class="editing__del" id="editDelete">削除</button>
          </span>
        </div>

        <div class="affix">
          <span class="affix__corner" aria-hidden="true"></span>
          <span class="affix__corner" aria-hidden="true"></span>
          <span class="affix__corner" aria-hidden="true"></span>
          <span class="affix__corner" aria-hidden="true"></span>
          <button type="button" class="affix__btn" id="scanBtn">画像から読み取る</button>
          <input type="file" id="photo" accept="image/*" tabindex="-1"
                 style="position:absolute;width:0;height:0;opacity:0">
          <p class="affix__hint affix__hint--paste">Ctrl+V で貼り付けても読み取ります</p>
          <div class="scanout" id="scanResult"></div>
        </div>

        <div class="row">
          <label class="lab" for="date">搭乗日<span class="lab__lat">DATE</span></label>
          <input type="date" class="fld" id="date" required>
        </div>

        <div class="row">
          <label class="lab" for="flightNo">便名<span class="lab__lat">FLIGHT</span></label>
          <input class="fld fld--fig fld--upper" id="flightNo" placeholder="NH262"
                 autocapitalize="characters" autocorrect="off" spellcheck="false">
        </div>

        <div class="row row--split">
          <div class="cell">
            <label class="lab" for="dep">出発<span class="lab__lat">FROM</span></label>
            <input class="fld fld--fig fld--upper" id="dep" placeholder="HND" maxlength="4" required
                   autocapitalize="characters" autocorrect="off" spellcheck="false">
          </div>
          <span class="row__arrow" aria-hidden="true">→</span>
          <div class="cell">
            <label class="lab" for="arr">到着<span class="lab__lat">TO</span></label>
            <input class="fld fld--fig fld--upper" id="arr" placeholder="ITM" maxlength="4" required
                   autocapitalize="characters" autocorrect="off" spellcheck="false">
          </div>
        </div>

        <div class="row">
          <label class="lab" for="registration">登録記号<span class="lab__lat">REGISTRATION</span></label>
          <input class="fld fld--reg fld--upper" id="registration" placeholder="JA873A" required
                 autocapitalize="characters" autocorrect="off" spellcheck="false">
          <div class="stamp" id="stamp"></div>
        </div>

        <div class="row">
          <label class="lab" for="aircraftType">機材型式<span class="lab__lat">TYPE</span></label>
          <input class="fld fld--fig" id="aircraftType" placeholder="B787-9">
        </div>

        <div class="row">
          <label class="lab" for="airline">航空会社<span class="lab__lat">OPERATOR</span></label>
          <div class="row__withmark">
            <button type="button" class="airlogo" id="airlineLogo" disabled
                    aria-label="この航空会社のロゴ画像を選ぶ"></button>
            <input class="fld" id="airline" placeholder="便名から自動判定">
          </div>
          <input type="file" id="airlineLogoFile" accept="image/*" tabindex="-1"
                 style="position:absolute;width:0;height:0;opacity:0">
        </div>

        <div class="row">
          <label class="lab" for="note">備考<span class="lab__lat">REMARKS</span></label>
          <input class="fld" id="note" placeholder="任意">
        </div>

        <p class="alert" id="formError"></p>
        <button type="submit" class="submit" id="submit">記入する</button>
      </form>
    </section>

    <section id="panel-log" class="panel" role="tabpanel" aria-labelledby="tab-log">
      <div class="tally" id="tally"></div>
      <p class="ledger__hint" id="ledgerHint" hidden>行をタップすると記入欄で直せます</p>
      <div class="ledger__head" aria-hidden="true">
        <span></span><span>ROUTE</span><span>AIRFRAME</span>
      </div>
      <div id="ledger"><p class="empty">読み込み中…</p></div>
      <footer class="colophon" id="colophon"></footer>
    </section>

  </div>

  <div id="suggest" class="suggest"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    var $ = function (id) { return document.getElementById(id); };

    var submitBtn = $('submit');
    var stampEl = $('stamp');
    var toastTimer = null;
    var scanning = false;
    var dateTouched = false;
    var editingId = 0;      // 0 なら新規記入、それ以外は台帳のその id を書き換える
    var logRows = [];       // 台帳の最新データ。編集で元の値を引くのに使う
    var suppressSuggest = false;
    var carrierByName = {};   // 航空会社名 → コード。起動時にサーバから受け取る

    /* ---------- タブ ---------- */

    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
      tab.addEventListener('click', function () { switchTab(tab.getAttribute('data-panel')); });
    });

    function switchTab(panelId) {
      hideSuggest();
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
        t.setAttribute('aria-selected', String(t.getAttribute('data-panel') === panelId));
      });
      Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) {
        p.setAttribute('data-active', String(p.id === panelId));
      });
      window.scrollTo(0, 0);
    }

    /* ---------- 起動 ---------- */

    google.script.run
      .withSuccessHandler(function (data) {
        if (!$('date').value) $('date').value = data.today;
        renderSuggestions(data.suggestions);
        renderLogos(data.logos);
        if (data.carriers) carrierByName = data.carriers;
        renderLog(data.log);
        updateAirlineSlot();
      })
      .withFailureHandler(function (err) {
        $('ledger').innerHTML = '<p class="empty">読み込みに失敗しました</p>';
        toast(errorText(err), true);
      })
      .bootstrap();

    /* ---------- 登録記号の照合（このアプリの主役） ---------- */

    var lookupTimer = null;
    var lastLookedUp = '';

    function scheduleLookup() {
      clearTimeout(lookupTimer);
      lookupTimer = setTimeout(runLookup, 500);
    }

    function runLookup() {
      clearTimeout(lookupTimer);
      var reg = $('registration').value.trim().toUpperCase();

      if (!reg) { lastLookedUp = ''; setStamp('', ''); return; }
      if (reg === lastLookedUp) return;
      lastLookedUp = reg;

      setStamp('load', '<span class="stamp__box"><span class="stamp__word">照合中</span></span>');

      google.script.run
        .withSuccessHandler(function (res) {
          // 照合中に入力が変わっていたら、古い結果は捨てる
          if ($('registration').value.trim().toUpperCase() !== reg) return;

          if (!res.found) {
            setStamp('first', '<span class="stamp__box"><span class="stamp__word">初 搭 乗</span></span>');
            return;
          }

          // 機体マスタが知っている型式・航空会社で上書きする
          if (res.type) $('aircraftType').value = res.type;
          if (res.airline) $('airline').value = res.airline;

          var html = '<span class="stamp__box"><span class="stamp__n">' + (res.timesFlown + 1) +
            '</span><span class="stamp__word">回目の搭乗</span></span>';

          var last = res.lastFlight;
          if (last) {
            var dep = last.depLabel || last.dep;
            var arr = last.arrLabel || last.arr;
            html += '<p class="stamp__prev">前回 ' + esc(last.date) +
              (last.flightNo ? ' · ' + esc(last.flightNo) : '') +
              (dep || arr ? ' · ' + esc(dep) + '→' + esc(arr) : '') + '</p>';
          }
          setStamp('repeat', html);
        })
        .withFailureHandler(function (err) {
          lastLookedUp = '';
          setStamp('', '');
          toast(errorText(err), true);
        })
        .lookupAircraft(reg, editingId);
    }

    $('registration').addEventListener('input', scheduleLookup);
    $('registration').addEventListener('blur', runLookup);

    function setStamp(state, html) {
      if (state) stampEl.setAttribute('data-state', state);
      else stampEl.removeAttribute('data-state');
      stampEl.innerHTML = html;
    }

    /* ---------- 便名から航空会社・区間を補完 ---------- */

    $('flightNo').addEventListener('input', updateAirlineSlot);

    $('flightNo').addEventListener('change', function () {
      var no = $('flightNo').value.trim().toUpperCase();
      updateAirlineSlot();
      if (!no) return;

      google.script.run
        .withSuccessHandler(function (res) {
          // 便名由来の値は「空欄のときだけ」埋める。手で直した内容を消さないため
          if (res.airline && !$('airline').value.trim()) $('airline').value = res.airline;
          if (res.dep && !$('dep').value.trim()) $('dep').value = res.dep;
          if (res.arr && !$('arr').value.trim()) $('arr').value = res.arr;
          if (res.type && !$('aircraftType').value.trim()) $('aircraftType').value = res.type;

          // 便名を入れた時点でサーバが取りに行っている。取れていれば枠へ反映する
          if (res.carrier && res.logo) {
            airlineLogoMap[res.carrier] = res.logo;
            updateAirlineSlot();
            renderLog(logRows);
          }
        })
        .withFailureHandler(function () { /* 補完の失敗は黙って無視する */ })
        .lookupFlightNo(no);
    });

    ['flightNo', 'dep', 'arr', 'registration'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        this.value = this.value.trim().toUpperCase();
      });
    });

    $('airline').addEventListener('input', updateAirlineSlot);

    $('airline').addEventListener('change', function () {
      updateAirlineSlot();

      // 便名が無くても航空会社名からコードが引けたなら、その時点で取りに行く
      var code = currentCarrier();
      if (!code || airlineLogoMap[code]) return;

      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.logo) return;
          airlineLogoMap[res.code] = res.logo;
          updateAirlineSlot();
          renderLog(logRows);
        })
        .withFailureHandler(function () { /* ロゴが無いだけなので黙って無視する */ })
        .ensureLogo(code);
    });

    $('date').addEventListener('change', function () { dateTouched = true; });

    /* ---------- 航空会社のロゴ枠 ---------- */

    /*
     * 便名の頭 2 文字。サーバの carrierCode_() と同じ規則。
     * 枠の描き替えのたびにサーバへ聞くと反応が遅れるので、表示の判断は手元で済ませる。
     * 実際に取りに行くのはサーバ（lookupFlightNo）。
     */
    function carrierFromFlightNo(no) {
      var m = String(no || '').toUpperCase().replace(/\s+/g, '').match(/^([A-Z0-9]{2})\d/);
      return m ? m[1] : '';
    }

    /*
     * いま記入している会社のコード。便名を優先し、無ければ航空会社名から引く。
     * 便名を入れずに航空会社だけ書く記入が普通にあるので、便名だけに頼らない。
     */
    function currentCarrier() {
      return carrierFromFlightNo($('flightNo').value)
        || carrierByName[$('airline').value.trim()]
        || '';
    }

    /** いまの便名に対応する会社のロゴ枠を描く */
    function updateAirlineSlot() {
      var el = $('airlineLogo');
      var code = currentCarrier();

      if (!code) {
        // 紐づける会社が決まらないので押せない
        el.disabled = true;
        el.removeAttribute('data-state');
        el.innerHTML = '<span class="airlogo__none">—</span>';
        return;
      }

      el.disabled = false;
      var logo = airlineLogoMap[code];
      if (logo) {
        el.setAttribute('data-state', 'has');
        el.innerHTML = '<img src="' + esc(logo) + '" alt="">';
      } else {
        el.setAttribute('data-state', 'code');
        el.innerHTML = '<span class="airlogo__code">' + esc(code) + '</span>';
      }
    }

    $('airlineLogo').addEventListener('click', function () {
      if (currentCarrier()) $('airlineLogoFile').click();
    });

    $('airlineLogoFile').addEventListener('change', function () {
      var file = this.files && this.files[0];
      this.value = '';   // 同じ画像をもう一度選べるようにする
      var code = currentCarrier();
      if (!file || !code) return;

      // ロゴは PNG で小さく。透過を保ったままシートに収める
      downscale(file, { maxSide: 128, type: 'image/png' }, function (dataUrl) {
        toast(code + ' のロゴを差し替えています…');
        google.script.run
          .withSuccessHandler(function (res) {
            airlineLogoMap[res.code] = res.logo;
            updateAirlineSlot();
            renderLog(logRows);
            toast(res.code + ' のロゴを差し替えました');
          })
          .withFailureHandler(function (err) { toast(errorText(err), true); })
          .setAirlineLogoImage(code, dataUrl);
      }, function (msg) { toast(msg, true); });
    });

    /* ---------- 記入の確認 ---------- */

    /*
     * ブラウザ任せの検証（required + 吹き出し）は使わない。
     * iOS の Safari は required で送信を止めるのに吹き出しを出さないため、
     * 「押しても何も起きない」という見え方になってしまう。
     */

    var REQUIRED_FIELDS = [
      { id: 'date', label: '搭乗日' },
      { id: 'dep', label: '出発' },
      { id: 'arr', label: '到着' },
      { id: 'registration', label: '登録記号' }
    ];

    function validateForm() {
      var bad = [];

      REQUIRED_FIELDS.forEach(function (f) {
        var empty = !$(f.id).value.trim();
        $(f.id).classList.toggle('is-invalid', empty);
        if (empty) bad.push(f);
      });

      if (!bad.length) { setFormError(''); return true; }

      setFormError('未記入 — ' + bad.map(function (f) { return f.label; }).join('、'));
      toast(bad[0].label + 'を記入してください', true);
      $(bad[0].id).focus();
      return false;
    }

    function setFormError(msg) {
      var el = $('formError');
      el.textContent = msg;
      el.setAttribute('data-show', String(!!msg));
    }

    function clearFieldErrors() {
      REQUIRED_FIELDS.forEach(function (f) { $(f.id).classList.remove('is-invalid'); });
      setFormError('');
    }

    // 直し始めたら印は引っ込める
    REQUIRED_FIELDS.forEach(function (f) {
      $(f.id).addEventListener('input', function () {
        if (!$(f.id).classList.contains('is-invalid')) return;
        $(f.id).classList.remove('is-invalid');
        if (!document.querySelector('.fld.is-invalid')) setFormError('');
      });
    });

    /* ---------- 保存 ---------- */

    $('form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validateForm()) return;

      // debounce 待ちの照合が残っていても、保存は保存として進める
      clearTimeout(lookupTimer);

      var payload = {
        id: editingId,
        date: $('date').value,
        flightNo: $('flightNo').value.trim().toUpperCase(),
        dep: $('dep').value.trim().toUpperCase(),
        arr: $('arr').value.trim().toUpperCase(),
        registration: $('registration').value.trim().toUpperCase(),
        aircraftType: $('aircraftType').value.trim(),
        airline: $('airline').value.trim(),
        note: $('note').value.trim()
      };

      setSaving(true);
      google.script.run
        .withSuccessHandler(function (res) {
          setSaving(false);
          renderLogos(res.logos);
          renderLog(res.log);
          renderSuggestions(res.suggestions);
          toast(res.registration + ' · ' + res.timesFlown + '回目として' +
            (res.edited ? '直しました' : '記入しました'));
          resetForm();
        })
        .withFailureHandler(function (err) {
          setSaving(false);
          toast(errorText(err), true);
        })
        .saveFlight(payload);
    });

    function setSaving(on) {
      submitBtn.disabled = on;
      submitBtn.textContent = on ? '記入中…' : (editingId ? '記入を直す' : '記入する');
    }

    function resetForm() {
      hideSuggest();
      clearFieldErrors();
      editingId = 0;
      disarmDelete();
      $('editing').setAttribute('data-show', 'false');
      submitBtn.textContent = '記入する';
      // 搭乗日は残す。同じ日に複数レグ乗ることがあるため
      ['flightNo', 'dep', 'arr', 'registration', 'aircraftType', 'airline', 'note'].forEach(function (id) {
        $(id).value = '';
      });
      lastLookedUp = '';
      setStamp('', '');
      updateAirlineSlot();
      $('scanResult').innerHTML = '';
      // 保存直後に候補が勝手に開かないよう、フォーカス移動の間だけ抑止する
      suppressSuggest = true;
      $('flightNo').focus();
      suppressSuggest = false;
    }

    /* ---------- 画像から読み取る ---------- */

    $('scanBtn').addEventListener('click', function () { $('photo').click(); });

    $('photo').addEventListener('change', function () {
      var file = this.files && this.files[0];
      this.value = '';   // 同じ画像をもう一度選べるようにする
      scanFile(file);
    });

    // 画像の貼り付け。Snipping Tool で撮った直後にそのまま流せる
    document.addEventListener('paste', function (e) {
      var file = imageFromClipboard(e.clipboardData);
      if (!file) return;   // 画像以外は通常の貼り付けに任せる
      e.preventDefault();
      scanFile(file);
    });

    /** クリップボードから画像を1つ取り出す。無ければ null */
    function imageFromClipboard(data) {
      if (!data) return null;

      var items = data.items || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
          return items[i].getAsFile();
        }
      }

      var files = data.files || [];
      for (var j = 0; j < files.length; j++) {
        if (files[j].type.indexOf('image/') === 0) return files[j];
      }
      return null;
    }

    /** ファイル選択でも貼り付けでも、読み取りはここに集約する */
    function scanFile(file) {
      if (!file || scanning) return;

      setScanning(true);
      downscale(file, { maxSide: 1600, type: 'image/jpeg', quality: 0.85 }, function (dataUrl) {
        google.script.run
          .withSuccessHandler(applyScan)
          .withFailureHandler(function (err) {
            setScanning(false);
            toast(errorText(err), true);
          })
          .scanImage(dataUrl);
      }, function (msg) {
        setScanning(false);
        toast(msg, true);
      });
    }

    /**
     * 画像を縮小して data URL にする。
     * カメラ画像はそのままだと数MBあり google.script.run に載らない。
     * 長辺 1600px あれば搭乗券の文字は OCR に十分な大きさで残る。
     */
    function downscale(file, opts, onDone, onError) {
      var maxSide = opts.maxSide;
      // ロゴは PNG。JPEG には透過が無く、透過部分が黒く塗られてしまう
      var type = opts.type || 'image/jpeg';
      var quality = opts.quality;

      var reader = new FileReader();
      reader.onerror = function () { onError('画像を読み込めませんでした'); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { onError('画像を解釈できませんでした'); };
        img.onload = function () {
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          onDone(quality ? canvas.toDataURL(type, quality) : canvas.toDataURL(type));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function applyScan(res) {
      setScanning(false);
      clearFieldErrors();

      var isBlank = function (id) {
        if (id === 'date') return !dateTouched;
        return !$(id).value.trim();
      };

      var filled = [];
      ['date', 'flightNo', 'dep', 'arr', 'registration', 'aircraftType', 'airline']
        .forEach(function (id) {
          // 空欄だけ埋める。手で直した内容を読み取り結果で消さないため
          if (!res[id] || !isBlank(id)) return;
          $(id).value = res[id];
          filled.push(labelOf(id));
        });

      var msg = filled.length
        ? '読み取り — ' + filled.join('、')
        : '項目を特定できませんでした。読み取ったテキストを確認してください。';

      // どちらの方式で読んだかを出す。Gemini を入れたのに OCR のままなら
      // キーの設定を疑える
      var engine = res.engine === 'gemini' ? 'GEMINI' : 'DRIVE OCR';
      var html = '<span class="scanout__engine">' + esc(engine) + '</span>' + esc(msg);
      if (res.note) html += '<p class="scanout__note">' + esc(res.note) + '</p>';
      html += '<details><summary>読み取ったテキスト</summary><pre>' +
        esc(res.rawText || '(空)') + '</pre></details>';

      $('scanResult').innerHTML = html;

      // 値を直接入れているので change が発火しない。枠は自分で描き替える
      updateAirlineSlot();
      if (res.registration) runLookup();
    }

    /** 入力欄のラベルから和名だけを取り出す */
    function labelOf(id) {
      var el = document.querySelector('label[for="' + id + '"]');
      if (!el) return id;
      var lat = el.querySelector('.lab__lat');
      return lat ? el.textContent.replace(lat.textContent, '').trim() : el.textContent.trim();
    }

    function setScanning(on) {
      scanning = on;
      $('scanBtn').disabled = on;
      $('scanBtn').textContent = on ? '読み取り中…' : '画像から読み取る';
      if (on) $('scanResult').textContent = '';
    }

    /* ---------- 台帳の描画 ---------- */

    /*
     * 航空会社コード → ロゴ。行ごとではなくマップで受け取るので、
     * 同じ会社が何行あっても画像データは 1 つで済む。
     * ここに無い会社は 2 レターコードの枠で出る。
     */
    var airlineLogoMap = {};

    function renderLogos(m) { if (m) airlineLogoMap = m; }

    function renderLog(rows) {
      var el = $('ledger');
      logRows = rows || [];
      $('tabCount').textContent = (rows && rows.length) ? rows.length : '';

      if (!rows || !rows.length) {
        el.innerHTML = '<p class="empty">まだ記入がありません</p>';
        $('tally').innerHTML = '';
        $('colophon').innerHTML = '';
        $('ledgerHint').hidden = true;
        return;
      }

      var regs = {};
      rows.forEach(function (r) { if (r.registration) regs[r.registration] = true; });

      $('ledgerHint').hidden = false;
      $('tally').innerHTML =
        '<span><span class="tally__n">' + rows.length + '</span>FLIGHTS</span>' +
        '<span><span class="tally__n">' + Object.keys(regs).length + '</span>AIRFRAMES</span>';

      // rows は搭乗日の新しい順で届くので、切り替わったところに年の罫を挟む。
      // 交互の地色は年ごとに数え直す
      var year = '';
      var alt = false;
      el.innerHTML = rows.map(function (r) {
        var head = '';
        var y = String(r.date || '').slice(0, 4);
        if (y && y !== year) {
          year = y;
          alt = false;
          head = '<div class="year">' + esc(y) + '</div>';
        }
        var row = logRow(r, alt);
        alt = !alt;
        return head + row;
      }).join('');

      var newest = String(rows[0].date || '').slice(0, 4);
      var oldest = String(rows[rows.length - 1].date || '').slice(0, 4);
      $('colophon').innerHTML =
        '<span>' + esc(oldest === newest ? newest : oldest + ' — ' + newest) + '</span>' +
        '<span>繰越 ' + rows.length + '</span>';
    }

    function logRow(r, alt) {
      var dep = r.depLabel || r.dep;
      var arr = r.arrLabel || r.arr;
      var hasRoute = !!(dep || arr);

      var leg;
      if (dep && arr) {
        // 両端に振り、間に飛行機を置く
        leg = '<span class="entry__port">' + esc(dep) + '</span>' +
          '<span class="entry__link" aria-hidden="true">' +
            '<svg viewBox="0 0 32 32"><use href="#ic-plane"/></svg>' +
          '</span>' +
          '<span class="entry__port entry__port--arr">' + esc(arr) + '</span>';
      } else {
        // 片側だけ、あるいは区間を必須にする前の記録。空行にせず繰り上げる
        var only = dep || arr || r.flightNo || '区間の記載なし';
        var cls = (hasRoute || r.flightNo) ? 'entry__port' : 'entry__port entry__port--none';
        leg = '<span class="' + cls + '">' + esc(only) + '</span>';
      }

      // 日付は空港名の下、補足の行の先頭に置く
      var day = String(r.date || '').slice(5).replace('-', '.');
      var meta = [day, hasRoute ? r.flightNo : '', r.airline].filter(Boolean).join(' · ');

      var logo = r.carrier ? airlineLogoMap[r.carrier] : '';
      var badge = '';
      if (logo) {
        badge = '<img class="carrier-logo" src="' + esc(logo) +
          '" alt="' + esc(r.airline || r.carrier) + '" width="40" height="40" loading="lazy">';
      } else if (r.carrier) {
        badge = '<span class="carrier">' + esc(r.carrier) + '</span>';
      }

      var mark = '<span class="entry__mark">' + badge + '</span>';

      return '<div class="entry' + (alt ? ' entry--alt' : '') + '">' +
        mark +
        '<button type="button" class="entry__body" data-id="' + esc(r.id) +
          '" aria-label="この記録を直す">' +
          '<span class="entry__main">' +
            '<span class="entry__leg">' + leg + '</span>' +
            '<span class="entry__meta">' + esc(meta) + '</span>' +
          '</span>' +
          '<span class="entry__reg">' + esc(r.registration) +
            '<span class="entry__type">' + esc(r.type) + '</span>' +
          '</span>' +
        '</button>' +
      '</div>';
    }

    /* ---------- 台帳からの操作 ---------- */

    /* クラス名で祖先をたどる。台帳は行ごとに要素を作り直すので委譲で受ける */
    function closestByClass(node, cls) {
      while (node && node !== document) {
        if (node.classList && node.classList.contains(cls)) return node;
        node = node.parentNode;
      }
      return null;
    }

    $('ledger').addEventListener('click', function (e) {
      var body = closestByClass(e.target, 'entry__body');
      if (body) startEdit(Number(body.getAttribute('data-id')));
    });

    $('editCancel').addEventListener('click', resetForm);

    /*
     * 削除は 2 段階。1 回目は身構えるだけで、5 秒触らなければ元に戻る。
     * 消えた記録は戻せないので、1 タップで消えないようにする。
     */
    var deleteArmTimer = null;

    function disarmDelete() {
      clearTimeout(deleteArmTimer);
      var btn = $('editDelete');
      btn.removeAttribute('data-arm');
      btn.textContent = '削除';
    }

    $('editDelete').addEventListener('click', function () {
      if (!editingId) return;
      var btn = $('editDelete');

      if (btn.getAttribute('data-arm') !== 'true') {
        btn.setAttribute('data-arm', 'true');
        btn.textContent = '本当に削除する';
        clearTimeout(deleteArmTimer);
        deleteArmTimer = setTimeout(disarmDelete, 5000);
        return;
      }

      var id = editingId;
      disarmDelete();
      btn.disabled = true;
      toast('削除しています…');

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          renderLogos(res.logos);
          renderLog(res.log);
          renderSuggestions(res.suggestions);
          resetForm();
          switchTab('panel-log');
          toast('記録を 1 件削除しました');
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          toast(errorText(err), true);
        })
        .deleteFlight(id);
    });

    /** 台帳の行を記入欄へ引き写して編集に入る。フォームはそのまま使い回す */
    function startEdit(id) {
      var r = null;
      for (var i = 0; i < logRows.length; i++) {
        if (Number(logRows[i].id) === id) { r = logRows[i]; break; }
      }
      if (!r) return;

      editingId = id;

      // 値を入れる間は候補を開かせない
      suppressSuggest = true;
      $('date').value = r.date || '';
      $('flightNo').value = r.flightNo || '';
      $('dep').value = r.dep || '';
      $('arr').value = r.arr || '';
      $('registration').value = r.registration || '';
      $('aircraftType').value = r.type || '';
      $('airline').value = r.airline || '';
      $('note').value = r.note || '';
      suppressSuggest = false;

      // 読み取りが搭乗日を上書きしないようにする
      dateTouched = true;
      clearFieldErrors();
      $('scanResult').innerHTML = '';
      lastLookedUp = '';
      setStamp('', '');

      $('editingLabel').textContent =
        [r.date, r.flightNo, r.registration].filter(Boolean).join(' · ') + ' を編集中';
      $('editing').setAttribute('data-show', 'true');
      submitBtn.textContent = '記入を直す';

      updateAirlineSlot();
      switchTab('panel-input');
      runLookup();
    }

    /* ---------- 入力候補 ---------- */

    /*
     * datalist は iOS の Safari でまともに表示されないため自前で作る。
     * 候補の箱は 1 つだけ用意し、入力中の欄の親に付け替えて使い回す。
     */

    var SUGGEST_SOURCE = {
      flightNo: 'flightNos',
      dep: 'airports',
      arr: 'airports',
      registration: 'registrations',
      aircraftType: 'types',
      airline: 'airlines'
    };

    var suggestData = {};
    var suggestEl = $('suggest');
    var suggestInput = null;

    function renderSuggestions(s) { if (s) suggestData = s; }

    /** 候補を {value, label} にそろえる。空港だけ {code, name} で届く */
    function suggestItems(inputId) {
      var raw = suggestData[SUGGEST_SOURCE[inputId]] || [];
      return raw.map(function (v) {
        if (v && typeof v === 'object') return { value: v.code, label: v.name || '' };
        return { value: String(v), label: '' };
      });
    }

    /** 前方一致を先に、部分一致を後ろに。多すぎても選べないので 50 件まで */
    function filterSuggest(items, query) {
      var q = String(query || '').trim().toUpperCase();
      if (!q) return items.slice(0, 50);

      var starts = [];
      var contains = [];
      items.forEach(function (it) {
        if (it.value.toUpperCase().indexOf(q) === 0) starts.push(it);
        else if ((it.value + ' ' + it.label).toUpperCase().indexOf(q) >= 0) contains.push(it);
      });
      return starts.concat(contains).slice(0, 50);
    }

    function showSuggest(input) {
      var items = filterSuggest(suggestItems(input.id), input.value);
      if (!items.length) { hideSuggest(); return; }

      suggestEl.innerHTML = items.map(function (it) {
        return '<div class="suggest__item" data-value="' + esc(it.value) + '">' +
          '<span class="suggest__val">' + esc(it.value) + '</span>' +
          (it.label ? '<span class="suggest__lab">' + esc(it.label) + '</span>' : '') +
          '</div>';
      }).join('');

      // 先に親を position:relative にしてから offsetTop を読む
      var host = input.parentNode;
      host.classList.add('combo-host');
      host.appendChild(suggestEl);

      suggestEl.style.top = (input.offsetTop + input.offsetHeight + 2) + 'px';
      suggestEl.style.left = input.offsetLeft + 'px';
      suggestEl.style.width = input.offsetWidth + 'px';
      suggestEl.style.display = 'block';
      suggestInput = input;
    }

    function hideSuggest() {
      suggestEl.style.display = 'none';
      suggestInput = null;
    }

    /**
     * 候補の選択。click で拾うのが肝心で、touchstart で拾うと指が触れた
     * 瞬間に確定してしまい、リストをスクロールすることもできなくなる。
     */
    function pickSuggest(e) {
      if (!suggestInput) return;

      var node = e.target;
      while (node && node !== suggestEl && !(node.classList && node.classList.contains('suggest__item'))) {
        node = node.parentNode;
      }
      if (!node || node === suggestEl) return;

      var input = suggestInput;
      input.value = node.getAttribute('data-value');
      hideSuggest();

      // 既存の大文字化・照合の処理につなぐ。
      // この input で候補が開き直さないよう抑止しておく
      suppressSuggest = true;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      suppressSuggest = false;
    }

    /**
     * 候補の外側を触ったら閉じる。blur で閉じるとリストを
     * スクロールしただけで消えてしまうため。ここでは preventDefault しない。
     */
    function hideIfOutside(e) {
      if (!suggestInput) return;

      var node = e.target;
      while (node) {
        if (node === suggestEl || node === suggestInput) return;
        node = node.parentNode;
      }
      hideSuggest();
    }

    suggestEl.addEventListener('click', pickSuggest);
    document.addEventListener('mousedown', hideIfOutside);
    document.addEventListener('touchstart', hideIfOutside, { passive: true });

    Object.keys(SUGGEST_SOURCE).forEach(function (id) {
      var el = $(id);
      el.addEventListener('focus', function () { if (!suppressSuggest) showSuggest(el); });
      el.addEventListener('input', function () { if (!suppressSuggest) showSuggest(el); });
    });

    /* ---------- ユーティリティ ---------- */

    function toast(msg, isError) {
      var el = $('toast');
      el.textContent = msg;
      el.setAttribute('data-kind', isError ? 'error' : 'ok');
      el.setAttribute('data-show', 'true');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.setAttribute('data-show', 'false'); }, isError ? 6000 : 3000);
    }

    function errorText(err) {
      return (err && err.message) ? err.message : '通信に失敗しました';
    }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
